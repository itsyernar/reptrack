<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="themeColor" name="theme-color" content="#f5f6f5" />
  <meta name="description" content="RepTrack — simple workout tracking." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>RepTrack</title>
  <script>
    try {
      const saved = JSON.parse(localStorage.getItem("reptrack-data-v1"));
      document.documentElement.dataset.theme = saved?.settings?.theme === "dark" ? "dark" : "light";
    } catch {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="stylesheet" href="simple.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">RT</div>
        <div>
          <strong>RepTrack</strong>
          <small data-i18n="simpleTracker">Simple workout tracker</small>
        </div>
      </div>
      <button id="quickTheme" class="icon-btn" type="button" aria-label="Toggle theme">◐</button>
    </header>

    <section id="homeView" class="view active">
      <div class="page-title">
        <h1 data-i18n="homeTitle">Train. Log. Progress.</h1>
      </div>

      <div class="card today-card">
        <div id="todayDay" class="eyebrow">Today</div>
        <div class="today-row">
          <div>
            <h2 id="todayWorkout">Ready to train?</h2>
            <p id="todayMeta"></p>
          </div>
          <button id="startToday" class="btn btn-primary" type="button" data-i18n="start">Start</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><strong id="weekSessions">0</strong><span data-i18n="thisWeek">workouts this week</span></div>
        <div class="stat"><strong id="weekVolume">0</strong><span data-i18n="volume">kg volume</span></div>
      </div>

      <div class="section-title">
        <h2 data-i18n="recent">Recent</h2>
      </div>
      <div id="recentWorkouts" class="list"></div>
    </section>

    <section id="workoutView" class="view">
      <div class="page-title">
        <h1 data-i18n="workout">Workout</h1>
        <p data-i18n="workoutSub">Only what you need while training.</p>
      </div>
      <div id="workoutRoot"></div>
    </section>

    <section id="progressView" class="view">
      <div class="page-title">
        <h1 data-i18n="progress">Progress</h1>
        <p data-i18n="progressSub">Strength trend and workout history.</p>
      </div>

      <div class="card">
        <div class="progress-controls">
          <label class="field">
            <span data-i18n="exercise">Exercise</span>
            <select id="progressExercise"></select>
          </label>
        </div>
        <div class="mini-stats">
          <div class="mini-stat"><strong id="progressBest">—</strong><span data-i18n="best">Best</span></div>
          <div class="mini-stat"><strong id="progressLatest">—</strong><span data-i18n="latest">Latest</span></div>
          <div class="mini-stat"><strong id="progressChange">—</strong><span data-i18n="change">Change</span></div>
        </div>
        <div class="chart"><canvas id="progressCanvas" width="640" height="220"></canvas></div>
      </div>

      <div class="section-title">
        <h2 data-i18n="history">History</h2>
        <span id="historyCount"></span>
      </div>
      <div id="historyList"></div>
    </section>

    <section id="moreView" class="view">
      <div class="page-title">
        <h1 data-i18n="more">More</h1>
        <p data-i18n="moreSub">Preferences and backup.</p>
      </div>

      <div class="card">
        <div class="settings-grid">
          <label class="field">
            <span data-i18n="language">Language</span>
            <select id="languageSelect"><option value="en">English</option><option value="ru">Русский</option></select>
          </label>
          <label class="field">
            <span data-i18n="theme">Theme</span>
            <select id="themeSelect"><option value="light" data-i18n="light">Light</option><option value="dark" data-i18n="dark">Dark</option></select>
          </label>
          <label class="field">
            <span data-i18n="unit">Unit</span>
            <select id="unitSelect"><option value="kg">kg</option><option value="lb">lb</option></select>
          </label>
          <label class="field">
            <span data-i18n="sets">Default sets</span>
            <select id="defaultSets"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
          </label>
        </div>
        <div class="more-actions">
          <button id="saveSettings" class="btn btn-primary" type="button" data-i18n="save">Save</button>
        </div>
      </div>

      <details class="more">
        <summary data-i18n="backup">Backup & data</summary>
        <div class="inside">
          <div class="more-actions">
            <button id="exportData" class="btn" type="button" data-i18n="export">Export</button>
            <label class="btn" for="importData" data-i18n="import">Import</label>
            <input id="importData" type="file" accept=".json,application/json" hidden />
            <button id="clearData" class="btn btn-danger" type="button" data-i18n="clear">Clear data</button>
          </div>
        </div>
      </details>
    </section>
  </main>

  <nav class="nav" aria-label="Primary navigation">
    <button class="active" data-view="homeView"><span class="nav-icon">⌂</span><span data-i18n="home">Home</span></button>
    <button data-view="workoutView"><span class="nav-icon">＋</span><span data-i18n="workout">Workout</span></button>
    <button data-view="progressView"><span class="nav-icon">↗</span><span data-i18n="progress">Progress</span></button>
    <button data-view="moreView"><span class="nav-icon">•••</span><span data-i18n="more">More</span></button>
  </nav>

<script src="simple-data.js"></script>
<script src="simple-workout.js"></script>
<script src="simple-progress.js"></script>
</body>
</html>
